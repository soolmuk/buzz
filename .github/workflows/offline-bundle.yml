name: Offline bundle

# Builds the air-gapped Buzz relay bundle: `docker save` tarballs for the relay
# and its dependencies, published as GitHub Release assets together with the
# installing side (`offline/`) and checksums.
#
# Nothing is compiled here. The relay image comes from upstream's GHCR
# publication, and `offline/images.lock` pins every image by digest, so this
# layer tracks upstream updates without touching upstream source.
#
#   schedule        digest check every 3 days (03:17 UTC); a release is cut only
#                   when a digest moved
#   workflow_dispatch  manual run (force / pin a relay tag / pick arches)
#
# A run creates exactly one release named `offline-<UTC date>`; that name is
# also written into offline/images.lock as `bundle`, which is what
# install.sh prints and what an operator pins.

on:
  schedule:
    # Every 3 days: day-of-month step 3 (1,4,7,…). At a month boundary the gap
    # can be 1 or 2 days instead of 3 — cron has no "every N days" form.
    - cron: "17 3 */3 * *"
  workflow_dispatch:
    inputs:
      upstream_tag:
        description: "Relay image tag to track (e.g. main or 0.3.0). Empty keeps the lock's value."
        required: false
        default: ""
      arches:
        description: "Architectures to package"
        type: choice
        options: [amd64, arm64, both]
        default: amd64
      force:
        description: "Cut a release even if no digest changed"
        type: boolean
        default: false

permissions: {}

# Serialize releases: two runs cutting overlapping bundles would race on the
# lock file and on the release tag.
concurrency:
  group: offline-bundle
  cancel-in-progress: false

env:
  UPSTREAM_REPO: ghcr.io/block/buzz
  LOCK_PATH: offline/images.lock

jobs:
  resolve:
    name: Resolve image digests
    # Skip inside the upstream repo (block/buzz) unless explicitly allowed;
    # this workflow publishes releases in whichever repo carries the offline
    # layer, which is a downstream fork.
    if: github.repository_owner != 'block' || vars.OFFLINE_BUNDLE_IN_CORE == 'true'
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    permissions:
      contents: read
    outputs:
      changed: ${{ steps.diff.outputs.changed }}
      bundle: ${{ steps.bundle.outputs.bundle }}
      arches: ${{ steps.bundle.outputs.arches }}
      upstream_tag: ${{ steps.bundle.outputs.upstream_tag }}
    steps:
      - uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10  # v6.0.3
        with:
          persist-credentials: false

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@d7f5e7f509e45cec5c76c4d5afdd7de93d0b3df5  # v4.1.0

      - name: Decide bundle name, upstream tag and arches
        id: bundle
        env:
          INPUT_TAG: ${{ inputs.upstream_tag }}
          INPUT_ARCHES: ${{ inputs.arches }}
        run: |
          set -euo pipefail
          lock_tag=$(jq -r '.upstream_tag' "$LOCK_PATH")
          upstream_tag="${INPUT_TAG:-$lock_tag}"
          [ -n "$upstream_tag" ] || upstream_tag=main

          case "${INPUT_ARCHES:-amd64}" in
            amd64) arches='[{"arch":"amd64","runner":"ubuntu-24.04"}]' ;;
            arm64) arches='[{"arch":"arm64","runner":"ubuntu-24.04-arm"}]' ;;
            both)  arches='[{"arch":"amd64","runner":"ubuntu-24.04"},{"arch":"arm64","runner":"ubuntu-24.04-arm"}]' ;;
            *) echo "::error::unknown arches input"; exit 1 ;;
          esac

          bundle="offline-$(date -u +%Y.%m.%d-%H%M)"
          echo "bundle=$bundle" >>"$GITHUB_OUTPUT"
          echo "upstream_tag=$upstream_tag" >>"$GITHUB_OUTPUT"
          echo "arches=$arches" >>"$GITHUB_OUTPUT"

      - name: Resolve digests and refresh the lock
        id: diff
        env:
          UPSTREAM_TAG: ${{ steps.bundle.outputs.upstream_tag }}
        run: |
          set -euo pipefail
          work=$(mktemp -d)
          cp "$LOCK_PATH" "$work/lock.json"

          # The relay ref follows the requested upstream tag; the dependency
          # refs come from the lock as-is.
          jq --arg tag "$UPSTREAM_TAG" \
            '.upstream_tag = $tag
             | .images |= map(if .name == "relay"
                 then .ref = ("ghcr.io/block/buzz:" + $tag)
                 else . end)' "$work/lock.json" >"$work/lock.refs.json"

          images=$(
            jq -c '.images[] | {name, ref}' "$work/lock.refs.json" |
              while IFS= read -r entry; do
                name=$(jq -r .name <<<"$entry")
                ref=$(jq -r .ref <<<"$entry")
                digest=$(docker buildx imagetools inspect "$ref" --format '{{json .Manifest}}' | jq -r .digest)
                [ -n "$digest" ] && [ "$digest" != "null" ] || { echo "::error::cannot resolve $ref"; exit 1; }
                jq -n --arg name "$name" --arg ref "$ref" --arg digest "$digest" \
                  '{name: $name, ref: $ref, digest: $digest}'
              done | jq -s '.'
          )

          jq --argjson images "$images" '.images = $images' "$work/lock.refs.json" >"$work/lock.new.json"

          old=$(jq -S '[.images[] | {name, digest}]' "$work/lock.json")
          new=$(jq -S '[.images[] | {name, digest}]' "$work/lock.new.json")
          if [ "$old" = "$new" ]; then
            echo "changed=false" >>"$GITHUB_OUTPUT"
            echo "No image digest moved; nothing to publish."
          else
            echo "changed=true" >>"$GITHUB_OUTPUT"
            echo "Digests changed:"
            diff <(jq -r '.images[] | "\(.name) \(.digest)"' "$work/lock.json") \
                 <(jq -r '.images[] | "\(.name) \(.digest)"' "$work/lock.new.json") || true
          fi

          mkdir -p artifacts
          cp "$work/lock.new.json" artifacts/resolved-lock.json
          jq -r '.images[] | "\(.name): \(.ref) @ \(.digest)"' artifacts/resolved-lock.json

      - name: Upload resolved lock
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a  # v7.0.1
        with:
          name: resolved-lock
          path: artifacts/resolved-lock.json
          retention-days: 7
          if-no-files-found: error

  package:
    name: Package images (${{ matrix.arch }})
    needs: resolve
    if: needs.resolve.outputs.changed == 'true' || inputs.force
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 60
    permissions:
      contents: read
    strategy:
      fail-fast: false
      matrix:
        include: ${{ fromJSON(needs.resolve.outputs.arches) }}
    steps:
      - uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10  # v6.0.3
        with:
          persist-credentials: false

      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c  # v8.0.1
        with:
          name: resolved-lock
          path: /tmp/resolved

      - name: Install packaging tools
        run: |
          set -euo pipefail
          sudo apt-get update -qq
          sudo apt-get install -y -qq --no-install-recommends jq

      - name: Package linux/${{ matrix.arch }}
        env:
          BUNDLE: ${{ needs.resolve.outputs.bundle }}
        run: |
          set -euo pipefail
          cp /tmp/resolved/resolved-lock.json "$LOCK_PATH"
          ./offline/scripts/package-images.sh "${{ matrix.arch }}" "$BUNDLE" ./dist

      - name: Fetch Docker Engine packages for Ubuntu 24.04
        # Only amd64 hosts get the Docker .debs: the target is an offline
        # Ubuntu 24.04 server, and these are the one thing it cannot get later.
        if: matrix.arch == 'amd64'
        env:
          DOCKER_DEBS: >-
            docker-ce_29.9.3-1~ubuntu.24.04~noble_amd64.deb
            docker-ce-cli_29.9.3-1~ubuntu.24.04~noble_amd64.deb
            containerd.io_2.4.2-3~ubuntu.24.04~noble_amd64.deb
            docker-buildx-plugin_0.38.1-1~ubuntu.24.04~noble_amd64.deb
            docker-compose-plugin_5.7.0-1~ubuntu.24.04~noble_amd64.deb
        run: |
          set -euo pipefail
          mkdir -p /tmp/docker-debs
          base=https://download.docker.com/linux/ubuntu/dists/noble/pool/stable/amd64
          for f in $DOCKER_DEBS; do
            curl -sSfL --retry 3 -o "/tmp/docker-debs/$f" "$base/$f"
          done
          ls -lh /tmp/docker-debs

      - name: Fetch iptables/nftables packages a minimal Ubuntu 24.04 lacks
        # dockerd cannot build its bridge or publish a port without them, and a
        # pristine Ubuntu 24.04 has neither. Let a pristine ubuntu:24.04 itself
        # decide the exact closure, so no hand-kept dependency list can drift.
        if: matrix.arch == 'amd64'
        env:
          BASE_IMAGE: ubuntu:24.04@sha256:fe81560990fae86dc4743202b2cb4d3df98d0bcf949173cecef15ce1127ef852
        run: |
          set -euo pipefail
          docker run --rm -v /tmp/docker-debs:/out "$BASE_IMAGE" bash -ec '
            apt-get update -qq
            apt-get install -y -qq --no-install-recommends --download-only iptables nftables
            cp /var/cache/apt/archives/*.deb /out/
          '
          ls -lh /tmp/docker-debs

      - name: Assemble the single-file bundle
        env:
          BUNDLE: ${{ needs.resolve.outputs.bundle }}
        run: |
          set -euo pipefail
          debs=""
          if [ "${{ matrix.arch }}" = "amd64" ]; then debs=/tmp/docker-debs; fi
          ./offline/scripts/make-bundle.sh "${{ matrix.arch }}" "$BUNDLE" ./dist ./dist/single "$debs"

      - name: Upload bundle assets
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a  # v7.0.1
        with:
          # Only the single archive: the loose per-image tarballs stay local so
          # a release does not ship the same 300 MB twice.
          name: bundle-${{ matrix.arch }}
          path: |
            dist/single/buzz-offline-*.tar.gz
            dist/single/buzz-offline-*.tar.gz.sha256
          retention-days: 7
          if-no-files-found: error

  release:
    name: Publish release
    needs: [resolve, package]
    if: needs.resolve.outputs.changed == 'true' || inputs.force
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    permissions:
      contents: write    # create the release and commit the refreshed lock
    steps:
      - uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10  # v6.0.3
        with:
          fetch-depth: 0

      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c  # v8.0.1
        with:
          pattern: bundle-*
          merge-multiple: true
          path: assets

      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c  # v8.0.1
        with:
          name: resolved-lock
          path: /tmp/resolved

      - name: Refresh the lock from the resolved digests
        env:
          BUNDLE: ${{ needs.resolve.outputs.bundle }}
        run: |
          set -euo pipefail
          jq --arg bundle "$BUNDLE" --arg now "$(date -u +%Y-%m-%dT%H:%M:%SZ)" \
            '.bundle = $bundle | .generated_at = $now' \
            /tmp/resolved/resolved-lock.json >"$LOCK_PATH"
          cat "$LOCK_PATH"

      - name: Create the release
        env:
          GH_TOKEN: ${{ github.token }}
          BUNDLE: ${{ needs.resolve.outputs.bundle }}
          UPSTREAM_TAG: ${{ needs.resolve.outputs.upstream_tag }}
        run: |
          set -euo pipefail
          ls -lh assets
          # One archive per arch; name the amd64 one explicitly (that is the
          # documented path) and leave the rest to the asset list.
          archive="buzz-offline-amd64-${BUNDLE#offline-}"
          [ -f "assets/${archive}.tar.gz" ] || archive="$(basename "$(ls assets/*.tar.gz | head -1)" .tar.gz)"

          {
            echo "Offline Buzz relay bundle \`${BUNDLE}\`."
            echo
            echo "Relay image tracks upstream \`ghcr.io/block/buzz:${UPSTREAM_TAG}\` at the digests below."
            echo
            echo "| image | ref | digest |"
            echo "|---|---|---|"
            jq -r '.images[] | "| \(.name) | `\(.ref)` | `\(.digest)` |"' "$LOCK_PATH"
            echo
            echo "Each architecture is ONE archive: the five image tarballs, the installing layer and (amd64) the Docker Engine packages it needs."
            echo "Nothing else is required and no network is touched."
            echo
            for a in assets/*.tar.gz; do
              echo "- \`$(basename "$a")\` — $(du -h "$a" | cut -f1)"
            done
            echo
            echo '```bash'
            echo "sha256sum -c ${archive}.tar.gz.sha256"
            echo "tar -xzf ${archive}.tar.gz && cd ${archive}"
            echo "sudo docker-debs/install.sh          # only if docker is not installed yet"
            echo "cd offline && sudo ./scripts/install.sh --host <server-ip> --port 80"
            echo '```'
            echo
            echo "HTTP only: no TLS, no reverse proxy. Clients use \`http://<host>\` and \`ws://<host>\`."
          } >/tmp/release-notes.md

          gh release create "$BUNDLE" \
            --title "Buzz offline bundle ${BUNDLE}" \
            --notes-file /tmp/release-notes.md \
            assets/*

      - name: Commit the refreshed lock
        env:
          BUNDLE: ${{ needs.resolve.outputs.bundle }}
        run: |
          set -euo pipefail
          if git diff --quiet -- "$LOCK_PATH"; then
            echo "Lock unchanged after packaging; nothing to commit."
            exit 0
          fi
          git config user.name "buzz-offline-bot"
          git config user.email "buzz-offline-bot@users.noreply.github.com"
          git add "$LOCK_PATH"
          git commit -m "chore(offline): pin image digests for ${BUNDLE} [skip ci]"
          git push origin "HEAD:${GITHUB_REF_NAME}"
